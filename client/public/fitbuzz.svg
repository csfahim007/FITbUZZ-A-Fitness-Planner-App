<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3a8"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
  </defs>

  <!-- dumbbell -->
  <g stroke="url(#barGradient)" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- bar -->
    <line x1="34" y1="64" x2="94" y2="64"/>
    <!-- left weight plates -->
    <line x1="26" y1="48" x2="26" y2="80"/>
    <line x1="34" y1="42" x2="34" y2="86"/>
    <!-- right weight plates -->
    <line x1="102" y1="48" x2="102" y2="80"/>
    <line x1="94" y1="42" x2="94" y2="86"/>
  </g>

  <!-- pulse / heartbeat line through the bar -->
  <path d="M40 64 L52 64 L58 50 L68 78 L74 64 L88 64"
        stroke="#7dd3a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
