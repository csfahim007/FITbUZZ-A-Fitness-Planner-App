<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E3C"/>
      <stop offset="100%" stop-color="#0B3D26"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FDD9A"/>
      <stop offset="100%" stop-color="#4CAF63"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Flexed arm / bicep icon -->
  <g transform="translate(256 266)">
    <!-- forearm + fist (lower left, angled up) -->
    <path d="M -150 90
             C -150 60 -140 20 -110 -6
             L -60 -46
             C -46 -58 -26 -58 -12 -46
             C 2 -34 2 -14 -12 -2
             L -54 32
             C -70 46 -80 66 -80 92
             C -80 118 -60 138 -34 138
             L -110 138
             C -132 138 -150 118 -150 92 Z"
          fill="url(#armGrad)"/>

    <!-- bicep bulge (upper arm curving to shoulder) -->
    <path d="M -12 -46
             C 20 -74 66 -84 104 -68
             C 146 -50 168 -8 158 34
             C 150 68 122 92 86 96
             C 56 100 28 88 10 64
             C -6 44 -8 18 4 -4
             C -6 -20 -8 -34 -12 -46 Z"
          fill="url(#armGrad)"/>

    <!-- highlight on bicep -->
    <path d="M 30 -40 C 58 -56 90 -54 112 -34 C 128 -18 132 6 122 26"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10"
          stroke-linecap="round"/>

    <!-- fist outline detail -->
    <path d="M -140 96 C -140 76 -126 62 -108 62 L -80 62"
          fill="none" stroke="#0B3D26" stroke-opacity="0.25" stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="56" letter-spacing="4" fill="#FFFFFF">FITBUZZ</text>
</svg>
