name: FITbUZZ CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # CI
  # ==========================================
  test:
    name: CI - Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------
      # Backend
      # ----------------------------------------
      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend syntax
        working-directory: server
        run: node --check server.js

      # ----------------------------------------
      # Frontend
      # ----------------------------------------
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_BASE_URL: https://api-fitbuzz.cloudafk.xyz
        run: npm run build

  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy through SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/fitbuzz_deploy_key
          chmod 600 ~/.ssh/fitbuzz_deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/fitbuzz_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p 10028 \
            "$VPS_USER@$VPS_HOST" \
            'cd /home/administrator/projects/FITbUZZ-A-Fitness-Planner-App && ./deploy.sh'

          rm -f ~/.ssh/fitbuzz_deploy_key
