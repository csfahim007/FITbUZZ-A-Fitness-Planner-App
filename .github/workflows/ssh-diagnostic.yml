name: FITbUZZ SSH Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-diagnostic:
    name: Diagnose SSH During Remote Build
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/fitbuzz_deploy_key
          chmod 600 ~/.ssh/fitbuzz_deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH and remote frontend build
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/fitbuzz_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o LogLevel=DEBUG3 \
            -p 10028 \
            "$VPS_USER@$VPS_HOST" \
            'cd /home/administrator/projects/FITbUZZ-A-Fitness-Planner-App/client && /usr/bin/time -v npm run build'

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/fitbuzz_deploy_key